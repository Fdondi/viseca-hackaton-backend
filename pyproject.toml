[project]
name = "leash"
version = "0.1.0"
description = "Agent on a Leash: an independent wallet-control layer for AI shopping agents (Viseca challenge)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.44"]

[project.scripts]
leash = "leash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
